id: SOP-ACT-01
version: 1
title: Dangerous heat for strenuous outdoor exercise
category: active_outdoor
severity: high
scope: activity
applies_to:
  activities: [running, cycling, hiking, outdoor_sports]
  groups: []
fallback: false
when:
  all:
    - fact: wx.max.apparent_temperature
      op: gte
      value: 40
guidance:
  - The feels-like temperature during this time is dangerously high for strenuous exercise.
  - Avoid strenuous exercise during this time.
  - Move the session indoors or to the coolest part of the day, and keep it shorter.
  - Stop immediately and seek medical help if you feel dizzy, nauseous or confused, or stop sweating.
cite: [wx.max.apparent_temperature, wx.max.temperature_2m, wx.max.uv_index]
rationale: Exertion adds body heat on top of environmental heat; at this feels-like level the risk is heat illness, not discomfort.
