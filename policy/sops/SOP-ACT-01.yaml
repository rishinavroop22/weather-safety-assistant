id: SOP-ACT-01
version: 1
title: Dangerous heat for strenuous outdoor exercise
category: active_outdoor
severity: high
scope: activity
applies_to:
  activities: [running, cycling, hiking, outdoor_sports]
  groups: []
fallback: false
when:
  all:
    - fact: wx.max.apparent_temperature
      op: gte
      value: 40
guidance:
  - The feels-like temperature during the window is dangerously high for strenuous exercise; state the peak feels-like temperature.
  - Advise against strenuous exercise during this window.
  - Suggest moving the session indoors or to the coolest part of the day, and keeping it shorter.
  - Tell the user to stop immediately and seek medical help if they feel dizzy, nauseous or confused, or stop sweating.
cite: [wx.max.apparent_temperature, wx.max.temperature_2m, wx.max.uv_index]
rationale: Exertion adds body heat on top of environmental heat; at this feels-like level the risk is heat illness, not discomfort.
