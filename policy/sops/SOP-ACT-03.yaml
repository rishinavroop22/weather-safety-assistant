id: SOP-ACT-03
version: 1
title: Strong gusts on exposed terrain or open water
category: active_outdoor
severity: high
scope: activity
applies_to:
  activities: [hiking, kayaking_boating, open_water_swimming]
  groups: []
fallback: false
when:
  all:
    - fact: wx.max.wind_gusts_10m
      op: gte
      value: 45
guidance:
  - Strong wind gusts are forecast during the window; state the peak gust speed.
  - On exposed trails, ridges and cliff edges, gusts can knock people off balance and bring down branches; choose a sheltered route or postpone.
  - For kayaking, boating or open-water swimming, recommend postponing, because gusts make capsizing and being pushed away from shore more likely.
  - If going ahead with a land activity, tell someone the route and the expected return time.
cite: [wx.max.wind_gusts_10m, wx.max.wind_speed_10m]
rationale: Gust hazards depend on exposure; the same wind is a nuisance in a city park but dangerous on a ridge or on water.
